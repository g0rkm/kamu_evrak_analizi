services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - LOG_FORMAT=json
      - ENVIRONMENT=production
      - MAINTENANCE_MODE=false
      - LOG_FILE=
      - ADMIN_TOKEN=
      - ANALYSIS_TIMEOUT=60
      - ALLOWED_FILE_TYPES=pdf,png,jpg,jpeg,tiff,bmp
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-30}
      - MAX_FILE_SIZE_MB=50
      - REQUEST_BODY_LIMIT_MB=100
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
      - ENABLE_NOTIFICATIONS=${ENABLE_NOTIFICATIONS:-true}
      - AUTO_BACKUP_ENABLED=${AUTO_BACKUP_ENABLED:-false}
    volumes:
      - history_data:/app/data/history
      - upload_data:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  history_data:
  upload_data:
