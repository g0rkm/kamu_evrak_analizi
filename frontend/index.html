<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kamu evraklarının yapay zekâ ile sınıflandırılması, analizi, mevzuat eşleştirmesi ve resmî yazı taslağı hazırlanması.">
    <meta name="color-scheme" content="light dark">
    <title>Kamu Evrak Analizi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M8 13h16M16 7l9 5H7l9-5zM10 15v7M14 15v7M18 15v7M22 15v7M7 25h18' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <script>
        // Tema tercihini ilk boyamadan önce uygula (yanıp sönmeyi önler)
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) { /* depolama kapalı */ }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <a href="#viewRoot" class="skip-link">İçeriğe geç</a>

    <header class="app-header">
        <div class="app-header__inner">
            <a class="brand" href="#dashboard" aria-label="Kamu Evrak Analizi ana sayfa">
                <span class="brand__mark" data-icon="landmark"></span>
                <span>
                    <span class="brand__title">Kamu Evrak Analizi</span><br>
                    <span class="brand__subtitle">Yapay zekâ destekli evrak işleme</span>
                </span>
            </a>
            <button type="button" class="nav-toggle" id="navToggle" aria-label="Menüyü aç/kapat" aria-expanded="false" aria-controls="mainNav">☰</button>
            <nav class="main-nav" id="mainNav" aria-label="Ana menü">
                <a href="#dashboard" class="nav-link" data-view="dashboard">Kontrol Paneli</a>
                <a href="#/analiz" class="nav-link" data-route="analiz">Analiz</a>
                <a href="#/gecmis" class="nav-link" data-route="gecmis">Geçmiş</a>
                <a href="#/karsilastir" class="nav-link" data-route="karsilastir">Karşılaştır</a>
                <a href="#search" class="nav-link" data-view="search">Arama</a>
                <div class="nav-more">
                    <button type="button" class="nav-link nav-more__btn" id="navMoreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="navMoreMenu">Daha Fazla <span class="nav-more__caret" aria-hidden="true">▾</span></button>
                    <div class="nav-more__menu" id="navMoreMenu" role="menu" hidden>
                        <a href="#/pii" class="nav-link" data-view="pii" role="menuitem">PII Analizi</a>
                        <a href="#/audit" class="nav-link" data-view="audit" role="menuitem">Denetim Günlüğü</a>
                        <a href="#/timeline" class="nav-link" data-view="timeline" role="menuitem">Zaman Çizelgesi</a>
                        <a href="#templates" class="nav-link" data-view="templates" role="menuitem">Şablonlar</a>
                        <a href="#export" class="nav-link" data-view="export" role="menuitem">Dışa Aktarım</a>
                        <a href="#notifications" class="nav-link" data-view="notifications" role="menuitem">Bildirimler</a>
                        <div class="nav-more__sep" role="separator"></div>
                        <a href="#metrics" class="nav-link" data-view="metrics" role="menuitem">Metrikler</a>
                        <a href="#system" class="nav-link" data-view="system" role="menuitem">Sistem Durumu</a>
                        <a href="#admin" class="nav-link" data-view="admin" role="menuitem">Yönetim</a>
                        <a href="#/settings" class="nav-link" data-view="settings" role="menuitem">Ayarlar</a>
                    </div>
                </div>
            </nav>
            <div class="header-actions">
                <span class="status-pill" id="systemStatus" role="status" data-state="unknown" title="Sistem durumu kontrol ediliyor">
                    <span class="status-pill__dot"></span><span class="status-pill__text">Kontrol ediliyor…</span>
                </span>
                <button type="button" class="btn btn--ghost btn--icon" id="themeToggle" aria-label="Koyu temaya geç"></button>
            </div>
        </div>
    </header>

    <main class="app-main" id="main" tabindex="-1">
        <div id="viewRoot" role="main">
            <noscript>
                <div class="card card__body">Bu uygulama JavaScript gerektirir. Lütfen tarayıcınızda JavaScript'i etkinleştirin.</div>
            </noscript>
        </div>
    </main>

    <div class="toaster" id="toaster" role="status" aria-live="polite"></div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
